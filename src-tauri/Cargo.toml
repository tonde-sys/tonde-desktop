[package]
name = "tonde-desktop"
version = "0.2.0"
description = "TONDE Desktop — Application guichetier Tauri"
authors = ["Vital"]
edition = "2021"

[lib]
name = "tonde_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-notification   = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store          = "2"
tauri-plugin-opener         = "2"
# Client HTTP natif (reqwest) : contourne le CORS du WebView vers l'API Render
tauri-plugin-http           = "2"
# Mise à jour automatique signée (minisign) + redémarrage après installation
tauri-plugin-updater        = "2"
tauri-plugin-process        = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
# Cache offline embarqué (SQLite compilé avec l'application)
rusqlite          = { version = "0.32", features = ["bundled"] }

# Coffre-fort d'identifiants natif du système (Windows Credential Manager)
[target.'cfg(target_os = "windows")'.dependencies]
keyring           = { version = "3", features = ["windows-native"] }
